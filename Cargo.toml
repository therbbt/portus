[workspace]
resolver = "2"
members = [
    "crates/portus-core",
    "crates/portus-shell",
    "crates/portus-ssh",
    "crates/portus-telnet",
    "crates/portus-serial",
    "crates/portus-rdp",
    "crates/portus-sftp",
    "app/portus",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/portus-app/portus"

[workspace.dependencies]
portus-core = { path = "crates/portus-core" }
portus-shell = { path = "crates/portus-shell" }
portus-ssh = { path = "crates/portus-ssh" }
portus-telnet = { path = "crates/portus-telnet" }
portus-serial = { path = "crates/portus-serial" }
portus-rdp = { path = "crates/portus-rdp" }
portus-sftp = { path = "crates/portus-sftp" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
bytes = "1"
directories = "5"

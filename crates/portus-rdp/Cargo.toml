[package]
name = "portus-rdp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
portus-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ironrdp = { version = "0.17", features = ["session", "connector", "graphics", "pdu"] }
ironrdp-blocking = "0.10"
tokio-rustls = "0.26"
sspi = { version = "0.21", features = ["network_client"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
